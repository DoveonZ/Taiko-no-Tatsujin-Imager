        const maxFirstX = Math.max(...rowCanvases.map(r => r.firstX));
        const infoH = (tjaModeActive && selectedCourse) ? FIXED_HEIGHT : 0;
        const musicY = infoH;
        const useGroupIndex = (tjaModeActive && selectedCourse?.hasBranch && branchViewMode === 'ALL') || (tjaModeActive && selectedCourse?.viewType === 'double' && (doubleViewMode === 'DOUBLE' || doubleViewMode === 'ALL'));
        let totalExtraGap = 0;
        for (let i = 0; i < currentRowLayouts.length - 1; i++) {
          if (useGroupIndex) {
            if (currentRowLayouts[i].groupIndex !== currentRowLayouts[i + 1].groupIndex) totalExtraGap += EXTRA_GAP_SAME_BRANCH;
          } else totalExtraGap += EXTRA_GAP_SAME_BRANCH;
        }
        const finalH = musicY + currentRowLayouts.length * ROW_TOTAL_HEIGHT + totalExtraGap;
        const maxW = Math.max(...rowCanvases.map((r, i) => (maxFirstX - r.firstX) + r.canvas.width));
        const mc = document.createElement('canvas');
        mc.width = Math.ceil(maxW);
        mc.height = Math.ceil(finalH);
        const ctx = mc.getContext('2d');
        if (!transparentBgActive) {
          ctx.fillStyle = '#151515';
          ctx.fillRect(0, 0, mc.width, mc.height);
        }
        if (tjaModeActive && selectedCourse) {
          const title = selectedCourse.title || '',
            diff = selectedCourse.name || '',
            lv = selectedCourse.level || '';
          let displayTitle = title;
          if (selectedCourse?.viewType === 'double') {
            const isTagTeam = isTagTeamCourse(selectedCourse);
            const labelMap = { SINGLE: '单人', DOUBLE: isTagTeam ? '双打' : '双人', P1: 'P1', P2: 'P2', ALL: '合并' };
            displayTitle = title + '(' + labelMap[doubleViewMode] + ')';
          } else if (selectedCourse.hasBranch && branchViewMode !== 'ALL') {
            const branchNames = { M: '達人', E: '玄人', N: '普通' };
            const branchName = branchNames[branchViewMode];
            if (branchName) displayTitle = title + '(' + branchName + ')';
          }
          const tags = [];
          if (visualFocusActive) tags.push('見た目重视');
          if (randomMap) tags.push('でたらめ');
          else if (invertActive) tags.push('あべこべ');
          const hsValNum = parseFloat(hsInput.value) || 1;
          if (Math.abs(hsValNum - 1) > 0.0001) tags.push(`HS:${hsValNum}`);
          const modifierText = tags.join(' ');
          ctx.save();
          const titleFont = userFontLoaded ? `"${userFontFamily}"` : '"DFPKanteiryu","KaiTi"';
          ctx.font = `bold 90px ${titleFont}, sans-serif`;
          ctx.fillStyle = '#e0d5c5';
          ctx.shadowColor = 'rgba(0,0,0,0.8)';
          ctx.shadowBlur = 4;
          ctx.fillText(displayTitle, 12, 90);
          if (diff || lv) {
            ctx.font = `bold 72px ${titleFont}, sans-serif`;
            let secondLine = diff + (lv ? lv : '');
            if (modifierText) secondLine += ' ' + modifierText;
            ctx.fillText(secondLine, 12, 180);
          }
          ctx.shadowColor = 'transparent';
          ctx.shadowBlur = 0;
          ctx.restore();
        }
        let y = musicY;
        currentRowLayouts.forEach((l, i) => {
          ctx.drawImage(rowCanvases[i].canvas, maxFirstX - rowCanvases[i].firstX, y);
          if (i < currentRowLayouts.length - 1) {
            let gap;
            if (useGroupIndex) gap = (currentRowLayouts[i].groupIndex !== currentRowLayouts[i + 1].groupIndex) ? ROW_TOTAL_HEIGHT + EXTRA_GAP_SAME_BRANCH : ROW_TOTAL_HEIGHT;
            else gap = ROW_TOTAL_HEIGHT + EXTRA_GAP_SAME_BRANCH;
            y += gap;
          }
        });
        const url = mc.toDataURL('image/png');
        const w = window.open('');
        if (w) {
          w.document.write(`<img src="${url}" style="max-width:100%;height:auto;background:#272727;">`);

      async function loadChineseMap() {
        try {
          const r = await fetch('map.txt');
          if (r.ok) {
            const t = await r.text();
            chineseNoteMap = parseChineseMap(t);
          } else {
            chineseNoteMap = getFallbackChineseMap();

        loadUserMap();

      function parseChineseMap(text) {
        const m = {};
        const ls = text.split('\n');
        let cur = null;
        for (let l of ls) {
          l = l.trim();
          if (l.startsWith('#')) cur = l.substring(1).trim();
          else if (l && cur) {
            for (const ch of l.split(/[ \t]+/))
              if (ch) m[ch] = cur;
          }
        }
        return m;
      }

        return {

  '卓': 'xoox',
  '井': 'xxxx',

  // 长度为 3 的 o/x 串
  '乾': 'ooo', '天': 'ooo', '品': 'ooo', '目': 'ooo',
  '坤': 'xxx', '地': 'xxx', '丰': 'xxx', '卉': 'xxx',
  '巽': 'xoo', '风': 'xoo', '有': 'xoo',
  '坎': 'xox', '水': 'xox', '卤': 'xox',
  '艮': 'xxo', '山': 'xxo', '佑': 'xxo',
  '兑': 'oox', '泽': 'oox',
  '离': 'oxo', '火': 'oxo', '咕': 'oxo',
  '震': 'oxx', '雷': 'oxx',

  // 长度为 2 的 o/x 串
  '外': 'ox', '叶': 'ox', '少阴': 'ox', '↖': 'ox', '↗': 'ox',
  '内': 'xo', '右': 'xo', '少阳': 'xo', '↘': 'xo', '↙': 'xo',
  '吕': 'oo', '太阳': 'oo', '滚红': 'oo',
  '爻': 'xx', '太阴': 'xx', '滚蓝': 'xx',

  // 长度为 1 的 o/x 串

  '咔': 'x', 'k': 'x', '乂': 'x', '阴': 'x', '蓝': 'x', '边': 'x', '🥶': 'x', 'か': 'x', 'カ': 'x', '🔵': 'x', '平静': 'x'

}

      function addMapRow(ch = '', note = '') {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td><input type="text" class="map-char" value="${escapeHtml(ch)}"></td><td><input type="text" class="map-note" value="${escapeHtml(note)}"></td><td><button class="btn btn-delete-row">🗑️</button></td>`;
        tr.querySelector('.btn-delete-row').addEventListener('click', () => tr.remove());
        mapTableBody.appendChild(tr);
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"]/g, m => ({ '&': '&', '<': '<', '>': '>', '"': '"' })[m]);
      }

      async function loadExamples() {
        try {
          const r = await fetch('example/example.txt');
          if (!r.ok) throw new Error();
          const t = await r.text();
          examples = parseExampleFile(t);
        } catch (e) {
          examples = getFallbackExamples();
        }
        renderExamples();
      }

      function parseExampleFile(t) {
        const res = [];
        const blocks = t.split(/\n(?=#)/);
        for (const b of blocks) {
          const ls = b.trim().split('\n');
          const label = ls[0].replace(/^#/, '').trim();
          const val = ls.slice(1).join('\n').trim();
          if (label && val) res.push({ label, value: val });
        }
        return res;
      }

      function getFallbackExamples() {
        return [
          { label: '夏祭', value: 'ooo ooo ooo xxx ooo ooo ooo xxx' },
          { label: '灵魂石', value: '|ooxoooxoooxxooxx|ooxoooxooxxooxxo\n|ooxoooxoxxooxxoo(|ooox)o(ooox)o(xooooox)ooo\n|ooxxooxxoxxxoxxx|ooxxooxx(xxxoooxoxox)' },
          { label: '工作2000', value: '[|ooo]ooxxxx[ooo]ooxxxx[|ooo]oxxxxx[ooo]xxx x \n[|ooo]ooxxoo[ooo]ooxxoo[|xxx]xxoooo[xxx]xxoooo\n[|ooo]ooxxxx[ooo]ooxxxx[|ooo]xx[ooo]xx[ooo][ooo]o x \n|o[xxx]xo[xxx]x[ooo]oox X [|ooo]ox[ooo]oxo O O' }
        ];
      }

      function renderExamples() {
        exampleDropdown.innerHTML = '';
        examples.forEach(ex => {
          const btn = document.createElement('button');
          btn.className = 'btn btn-example';
          btn.textContent = ex.label;
          btn.addEventListener('click', (e) => {
            showLoading();
            textarea.value = ex.value.replace(/\\n/g, '\n');
            canvasCache.clear();
            if (tjaModeActive) {
              tjaModeActive = false;
              btnModeSwitch.textContent = '切换到TJA模式';
              updateTjaModeUI();
            }
            courseContainer.style.display = 'none';
            exampleDropdown.style.display = 'none';
            render();
            e.stopPropagation();
          });
          exampleDropdown.appendChild(btn);
        });
      }

      async function loadExternalTJA() {
        try {
          const r = await fetch('example/example.tja');
          if (!r.ok) throw new Error();
          return await r.text();
        } catch (e) {
          return FALLBACK_TJA;
        }
      }

      async function enterTJAMode() {
        hideLoadingImmediate();
        showLoading();
        tjaModeActive = true;
        btnModeSwitch.textContent = '切换到ox模式';
            // 重置 HS 设定
        hsInput.value = 1.0;
        if (hsOverrideActive) {
            hsOverrideActive = false;
            btnHsAdjust.classList.remove('active');
        }
        updateTjaModeUI();
        const tjaContent = await loadExternalTJA();
        textarea.value = tjaContent;
        selectedCourse = null;
        tjaCourses = parseTJA(tjaContent);
        selectedCourse = tjaCourses.length ? tjaCourses[0] : null;
        updateCourseButtons();
        transparentBgActive = false;
        bgMergeCheckbox.checked = false;
        render();
      }

      function exitTJAMode(clear = true) {
        tjaModeActive = false;
        btnModeSwitch.textContent = '切换到TJA模式';
                // 重置 HS 设定
        hsInput.value = 1.0;
        if (hsOverrideActive) {
            hsOverrideActive = false;
            btnHsAdjust.classList.remove('active');
        }
        updateTjaModeUI();
        if (clear) textarea.value = '';
        courseContainer.style.display = 'none';
        selectedCourse = null;
        hideLoadingImmediate();
        render();
      }

      async function loadCustomFont() {
        try {
          const font = new FontFace('DFPKanteiryu', 'url(Font/Modified-DFPKanteiryu-XB-Fixed.ttf)');
          await font.load();
          document.fonts.add(font);
          userFontLoaded = true;
        } catch (e) {
          console.warn('勘亭流加载失败', e);
          userFontLoaded = false;
        }
      }
      async function loadNumberFont() {
          try {
              const font = new FontFace('FZYuan', 'url(Font/方正粗圆_GBK.ttf)');
              await font.load();
              document.fonts.add(font);
          } catch (e) {
              console.warn('方正粗圆字体加载失败', e);
          }
      }

      async function initialize() {
        loadingVideo.load();
        await loadCustomFont();
        await loadNumberFont(); 
        await loadChineseMap();
        await loadExamples();
        preloadAllImages();
        preloadNameplateImages();
        switchImageRefs(0);
        updateTjaModeUI();
        updateStyleButtonIcon();
        textarea.value = '';
        textarea.setAttribute('wrap', 'off');
        appContainer.classList.add('layout-ox');
        appContainer.classList.remove('layout-tja');
      }
      initialize();
      // 侧边栏开关
      sidebarToggle.addEventListener('click', () => {
        sidebar.classList.toggle('open');
      });

      // 点击页面空白关闭侧边栏（可选）
      document.addEventListener('click', (e) => {
        if (!sidebar.contains(e.target) && e.target !== sidebarToggle) {
          sidebar.classList.remove('open');
        }
      });

      // 页面切换
      sidebarBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          sidebarBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const page = btn.dataset.page;
          if (page === 'taiko') {
            taikoPage.style.display = '';
            nameplatePage.style.display = 'none';
          } else if (page === 'nameplate') {
            taikoPage.style.display = 'none';
            nameplatePage.style.display = '';
            // 等待图片加载完成后绘制
            if (nameplateImages.bars.length === 12 && 
                nameplateLoaded.shadow && 
                nameplateLoaded.overlay) {
              loadIconsAndRedraw();
            } else {
              // 如果未加载完，注册一次性事件
              const checkAndDraw = setInterval(() => {
                if (nameplateImages.bars.length === 12 && 
                    nameplateLoaded.shadow && 
                    nameplateLoaded.overlay) {
                  clearInterval(checkAndDraw);
                  loadIconsAndRedraw();
                }
              }, 100);
            }
          }
          sidebar.classList.remove('open');
        });
      });
      // 歌曲名牌图片资源
// 样式配置：名称和描边色
const nameplateStyles = [
  { name: '热门', color: '#620616' },
  { name: '流行', color: '#12484c' },
  { name: '儿童', color: '#a43200' },
  { name: '动漫', color: '#9a1863' },
  { name: '博歌乐', color: '#263449' },
  { name: '游戏', color: '#4e1d75' },
  { name: '南梦宫原创', color: '#951f00' },
  { name: '古典', color: '#65432a' },
  { name: '综合', color: '#144f14' },
  { name: '最近', color: '#12484c' },
  { name: '收藏', color: '#a43200' },
  { name: '段位', color: '#00195f' }
];

// 歌曲名牌图片资源
const nameplateImages = {
  shadow: null,
  bars: [],    // 0~11
  overlay: null
};
const nameplateLoaded = {};
// 图标缓存
let crownCache = {};
let scoreCache = {};

function getIconKey(diff, type) {
  return `${diff}-${type}`;
}

function loadIcon(path, cacheObj, key) {
  if (cacheObj[key]) {
    return Promise.resolve(cacheObj[key]);
  }
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      cacheObj[key] = img;
      resolve(img);
    };
    img.onerror = reject;
    img.src = path;
  });
}

async function loadIconsAndRedraw() {
  const canvas = document.getElementById('nameplateCanvas');
  if (!canvas) return;

  const diff = parseInt(document.getElementById('nameplateDifficulty')?.value) || 4;
  const crown = parseInt(document.getElementById('nameplateCrown')?.value) || 0;
  const score = parseInt(document.getElementById('nameplateScore')?.value) || 0;

  let crownImg = null;
  let scoreImg = null;
  const promises = [];

  if (crown > 0) {
    const crownPath = `img/Crown/${diff}${crown - 1}.png`;   // 值减1
    promises.push(loadIcon(crownPath, crownCache, getIconKey(diff, crown)).then(img => crownImg = img));
  }
  if (score > 0) {
    const scorePath = `img/Score/${diff}${score - 1}.png`;   // 值减1
    promises.push(loadIcon(scorePath, scoreCache, getIconKey(diff, score)).then(img => scoreImg = img));
  }

    await Promise.all(promises).catch(err => {
    console.warn('图标加载失败，将忽略图标:', err);
    // 即使加载失败，也继续绘制（crownImg, scoreImg 保持 null）
  });
  drawNameplate(crownImg, scoreImg);
}
function preloadNameplateImages() {
  nameplateImages.shadow = new Image();
  nameplateImages.shadow.src = 'img/Bar/shadow.png';
  nameplateImages.shadow.onload = () => {
    nameplateLoaded.shadow = true;
    maybeUpdateNameplate();
  };

  for (let i = 0; i <= 11; i++) {
    const img = new Image();
    img.src = `img/Bar/${i}.png`;
    img.onload = (function(index) {
      return () => {
        nameplateImages.bars[index] = img;
        nameplateLoaded[`bar${index}`] = true;
        maybeUpdateNameplate();
      };
    })(i);
    nameplateImages.bars.push(img);
  }

  nameplateImages.overlay = new Image();
  nameplateImages.overlay.src = 'img/Bar/Overlay.png';
  nameplateImages.overlay.onload = () => {
    nameplateLoaded.overlay = true;
    maybeUpdateNameplate();
  };
}

function maybeUpdateNameplate() {
  const allBarsLoaded = nameplateImages.bars.length === 12 && nameplateImages.bars.every(img => img.complete);
  if (nameplateLoaded.shadow && allBarsLoaded && nameplateLoaded.overlay) {
    if (nameplatePage.style.display !== 'none') {
      loadIconsAndRedraw();
    }
  }
}

function drawNameplate(crownImg = null, scoreImg = null) {
  const canvas = document.getElementById('nameplateCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const styleIndex = parseInt(document.getElementById('nameplateStyle').value) || 0;
  const text = document.getElementById('nameplateText').value || '';

  const width = 948;
  const height = 143;
  canvas.width = width;
  canvas.height = height;

  // 绘制图片（从下到上）
  if (nameplateImages.shadow && nameplateImages.shadow.complete) {
    ctx.drawImage(nameplateImages.shadow, 0, 0);
  }
  
  const barImg = nameplateImages.bars[styleIndex];
  if (barImg && barImg.complete) {
    const barW = 938, barH = 133;
    const x = (width - barW) / 2;
    const y = (height - barH) / 2;
    ctx.drawImage(barImg, x, y, barW, barH);
  }

  if (nameplateImages.overlay && nameplateImages.overlay.complete) {
    const opW = 938, opH = 133;
    const x = (width - opW) / 2;
    const y = (height - opH) / 2;
    ctx.drawImage(nameplateImages.overlay, x, y, opW, opH);
  }
  if (crownImg && crownImg.complete && crownImg.naturalWidth > 0) {
    ctx.drawImage(crownImg, 18, 13, 80 * 0.75, 80 * 0.75);
  }
  if (scoreImg && scoreImg.complete && scoreImg.naturalWidth > 0) {
    ctx.drawImage(scoreImg, 18, 66, 80 * 0.75, 80 * 0.75);
  }
  // 文字位置
  const textX = width / 2;
  const textY = height / 2;

  // 获取当前样式对应的描边色
  const strokeColor = nameplateStyles[styleIndex] ? nameplateStyles[styleIndex].color : '#620616';

  // 下层描边（粗体）
  ctx.save();
  ctx.font = 'bold 42px "DFPKanteiryu", sans-serif';
  ctx.lineWidth = 7;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = strokeColor;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.strokeText(text, textX, textY);
  ctx.restore();

  // 上层白色填充
  ctx.save();
  ctx.font = '42px "DFPKanteiryu", sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, textX, textY);
  ctx.restore();
}

function updateNameplatePreview() {
  // 如果图片还没加载完，等加载完会自动调用 drawNameplate
  if (nameplateLoaded.shadow && nameplateLoaded.overlay && nameplateImages.bars.length === 12 && nameplateImages.bars.every(img => img && img.complete)) {
    loadIconsAndRedraw();
  }
}

document.getElementById('nameplateStyle').addEventListener('change', updateNameplatePreview);
document.getElementById('nameplateText').addEventListener('input', updateNameplatePreview);
document.getElementById('nameplateDifficulty').addEventListener('change', updateNameplatePreview);
document.getElementById('nameplateCrown').addEventListener('change', updateNameplatePreview);
document.getElementById('nameplateScore').addEventListener('change', updateNameplatePreview);

document.getElementById('btnDownloadNameplate').addEventListener('click', () => {
  const canvas = document.getElementById('nameplateCanvas');
  if (!canvas.width) {
    loadIconsAndRedraw(); // 强制绘制
  }
  const url = canvas.toDataURL('image/png');
  const link = document.createElement('a');
  link.download = 'music_nameplate.png';
  link.href = url;
  link.click();
});

    })();
