<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>太鼓之达人图像生成器</title>
  <style>
    :root {
      --bg: #f5f0eb;
      --card-bg: #ffffff;
      --text: #2c2416;
      --text-secondary: #6b5e4a;
      --border: #e0d5c5;
      --accent: #c17f59;
      --accent-hover: #a06b48;
      --input-bg: #fdfaf6;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.10);
      --radius: 12px;
      --radius-sm: 8px;
      --transition: 0.2s ease;
      --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', 'Menlo', monospace;
      --preview-bg: #151515;
      --preview-card-bg: #1e1e1e;
      --preview-text: #e0d5c5;
      --preview-border: #4a3f35;
      --ctrl-height: 40px;
      --tja-left-width: 420px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 12px;
      background-image: radial-gradient(ellipse at 30% 20%, rgba(193, 127, 89, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 80%, rgba(160, 140, 110, 0.05) 0%, transparent 60%);
    }

    .app-container {
      width: 100%;
      max-width: 1300px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
      padding: 28px 24px;
      display: grid;
      gap: 14px;
      grid-template-columns: 1fr;
      grid-template-areas:
        'header'
        'preview'
        'input'
        'course'
        'warning'
        'info'
        'legend';
    }

    .app-container.layout-tja {
      max-width: 1700px;           /* 原 1300px → 1500px，整体更宽 */
      --tja-left-width: 380px; 
      grid-template-columns: 380px 1fr;
      grid-template-columns: var(--tja-left-width) 1fr;
      grid-template-areas:
        'header header'
        'input preview'
        'course preview'
        'warning preview'
        'info preview';
      height: calc(100vh - 24px);
      overflow: hidden;
      gap: 12px 18px;
      padding: 20px 18px;
      align-items: start;
    }

    .app-container.layout-tja .preview-outer {
      overflow-y: auto;
      max-height: none;
      align-self: stretch;
      margin-top: 0;
    }

    .app-container.layout-tja .input-section {
      gap: 8px;
    }

    .app-container.layout-tja .textarea-wrapper textarea {
      min-height: 8em;
      font-size: 0.9rem;
      padding: 10px 12px;
    }

    .app-container.layout-tja .controls-row {
      gap: 6px;
    }

    .app-container.layout-tja .course-row {
      margin-top: 2px;
    }

    .app-container.layout-tja #infoBar {
      align-self: end;
    }

    .app-header {
      grid-area: header;
    }

    .app-header h1 {
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      font-size: 0.95rem;
      color: var(--text-secondary);
    }

    .preview-outer {
      grid-area: preview;
      background: var(--preview-bg);
      border: 2px dashed var(--preview-border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      min-height: 200px;
      overflow-x: auto;
      overflow-y: auto;
    }

    .input-section {
      grid-area: input;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .course-row {
      grid-area: course;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 2px;
    }

    #divergenceWarning {
      grid-area: warning;
      background: #1e1e1e;
      color: #e0d5c5;
      padding: 8px 16px;
      border-radius: 8px;
      text-align: center;
      font-size: 0.9rem;
      display: none;
    }

    .info-bar {
      grid-area: info;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .legend-bottom {
      grid-area: legend;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.78rem;
      color: var(--text-secondary);
      align-items: center;
    }

    .tutorial-bottom {
      grid-area: legend;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.78rem;
      color: var(--text-secondary);
      align-items: center;
    }

    .legend-bottom span,
    .tutorial-bottom span {
      background: #f8f5f0;
      padding: 4px 10px;
      border-radius: 14px;
    }

    .legend-bottom code,
    .tutorial-bottom code {
      font-family: var(--font-mono);
      background: #e8e0d2;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
      flex-wrap: wrap;
    }

    .textarea-wrapper {
      flex: 1;
      min-width: 280px;
      display: flex;
    }

    .textarea-wrapper textarea {
      flex: 1;
      padding: 14px 16px;
      font-size: 1.05rem;
      font-family: var(--font-mono);
      letter-spacing: 0.04em;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: var(--input-bg);
      color: var(--text);
      outline: none;
      resize: vertical;
      line-height: 1.6;
      min-height: 10em;
      white-space: pre;
      overflow-x: auto;
      transition: border-color 0.2s;
    }

    .textarea-wrapper textarea.drag-over {
      border-color: var(--accent) !important;
      background: #fdf7f0 !important;
    }

    .btn {
      padding: 0 16px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f8f5f0;
      color: var(--text-secondary);
      border: 1.5px solid var(--border);
      white-space: nowrap;
      height: var(--ctrl-height);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn:hover {
      background: #f0ebe0;
    }

    .btn.active {
      background: #e8d5c0;
      border-color: var(--accent);
    }

    .btn-example {
      padding: 6px 12px;
      font-size: 0.85rem;
      font-family: var(--font-mono);
      height: auto;
    }

    .icon-btn {
      width: var(--ctrl-height);
      height: var(--ctrl-height);
      padding: 2px;
      background: #f8f5f0;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .icon-btn img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .icon-btn.active {
      background: #e8d5c0;
      border-color: var(--accent);
    }

    #btnStyleSwitch {
      padding: 2px;
    }

    #btnStyleSwitch img {
      max-width: 28px;
      max-height: 28px;
    }

    .smallify-btn {
      height: var(--ctrl-height);
      width: calc(var(--ctrl-height) * 2);
      background: #f8f5f0;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 2px;
      flex-shrink: 0;
    }

    #smallifyImgBig {
      height: 24px;
      object-fit: contain;
    }

    #smallifyImgSmall {
      height: 16px;
      object-fit: contain;
    }

    .smallify-btn .arrow {
      font-size: 1.2rem;
      line-height: 1;
    }

    .smallify-btn.active {
      background: #e8d5c0;
      border-color: var(--accent);
    }

    .example-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-lg);
      padding: 12px;
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      z-index: 20;
      max-width: 400px;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .control-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: var(--ctrl-height);
    }

    .control-item input[type="number"] {
      width: 70px;
      padding: 0 8px;
      height: var(--ctrl-height);
      border: 2px solid var(--border);
      border-radius: 6px;
      font-family: var(--font-mono);
      background: var(--input-bg);
    }

    .preview-checkboxes {
      display: flex;
      gap: 12px;
      padding: 6px 0;
      color: var(--preview-text);
      font-size: 0.85rem;
      position: relative;
      z-index: 2;
    }

    .preview-checkboxes label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .preview-row {
      background: var(--preview-card-bg);
      border: 1px solid var(--preview-border);
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 1;
    }

    .preview-row-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      margin-bottom: 8px;
      color: var(--preview-text);
    }

    .preview-canvas-wrapper {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
    }

    .preview-canvas-wrapper canvas {
      display: block;
      border: 1px solid var(--preview-border);
      background: transparent;
      max-width: 100%;
      height: auto;
    }

    #loadingOverlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #151515;
      z-index: 10;
      align-items: flex-start;
      justify-content: center;
      padding-top: 30px;
      border-radius: var(--radius);
    }

    #loadingOverlay.visible {
      display: flex;
    }

    #loadingVideo {
      width: 390px;
      max-width: 90%;
      height: auto;
      max-height: 195px;
      object-fit: contain;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .file-upload {
      display: inline-block;
      position: relative;
      overflow: hidden;
      height: var(--ctrl-height);
    }

    .file-upload input[type=file] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .tja-only {
      display: none;
    }

    #mapModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    #mapTable th,
    #mapTable td {
      padding: 6px;
      border-bottom: 1px solid var(--border);
    }

    #mapTable input {
      width: 100%;
      border: 1px solid var(--border);
      padding: 4px;
      border-radius: 4px;
      font-family: var(--font-mono);
    }

    #optionsModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1001;
      align-items: center;
      justify-content: center;
    }

    .options-content {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      max-width: 500px;
      width: 90%;
      box-shadow: var(--shadow-lg);
    }

    .option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 12px 0;
    }

    .option-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 16px 0;
    }

    .option-section-label {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text);
      margin-bottom: 6px;
    }

    .branch-order {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .branch-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f8f5f0;
      padding: 8px;
      border-radius: 6px;
      cursor: grab;
      user-select: none;
    }

    .branch-item:active {
      cursor: grabbing;
    }

    .branch-item label {
      margin-right: auto;
    }

    .branch-item input[type="checkbox"] {
      margin-left: 8px;
    }

    /* 侧边栏与导航 */
    .sidebar-toggle {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 2001;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      width: 48px;
      height: 48px;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
      transition: background 0.2s;
    }
    .sidebar-toggle:hover {
      background: var(--accent-hover);
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 260px;
      height: 100vh;
      background: var(--card-bg);
      box-shadow: 2px 0 12px rgba(0,0,0,0.15);
      z-index: 2000;
      padding: 80px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: left 0.3s ease;
    }
    .sidebar.open {
      left: 0;
    }

    .sidebar-menu-btn {
      padding: 12px 16px;
      border: none;
      border-radius: var(--radius-sm);
      background: #f8f5f0;
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s;
    }
    .sidebar-menu-btn.active {
      background: var(--accent);
      color: #fff;
    }

    /* 歌曲名牌预览区 */
    .music-nameplate-preview {
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--preview-bg);
      border: 2px dashed var(--preview-border);
      border-radius: var(--radius);
      padding: 20px;
      min-height: 200px;
    }
    .music-nameplate-preview canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }

    @media (max-width: 768px) {
      .app-container {
        padding: 16px 12px;
        gap: 10px;
        grid-template-columns: 1fr !important;
        grid-template-areas:
          'header'
          'preview'
          'input'
          'course'
          'warning'
          'info'
          'legend' !important;
        height: auto !important;
        overflow: visible !important;
      }

      .app-container.layout-tja .preview-outer {
        overflow-y: visible;
        max-height: none;
        align-self: auto;
      }

      .app-container.layout-tja {
        height: auto !important;
        overflow: visible !important;
      }

      .app-header h1 {
        font-size: 1.5rem;
      }

      .textarea-wrapper textarea {
        font-size: 0.9rem;
        min-height: 6em;
        padding: 10px;
      }

      .btn {
        padding: 0 12px;
        font-size: 0.8rem;
        height: 36px;
      }

      .btn-primary {
        padding: 0 12px;
      }

      .btn-example {
        padding: 4px 8px;
        font-size: 0.7rem;
        height: auto;
      }

      .icon-btn {
        width: 36px;
        height: 36px;
      }

      .icon-btn img {
        width: 24px;
        height: 24px;
      }

      .controls-row {
        gap: 8px;
      }

      .control-item input[type="number"] {
        width: 60px;
        padding: 0 6px;
        height: 36px;
      }

      .preview-outer {
        padding: 8px;
        min-height: 150px;
        overflow-x: auto;
        overflow-y: auto;
      }

      .preview-row {
        padding: 8px;
      }

      #btnStyleSwitch img {
        width: 24px;
        height: 24px;
      }

      .file-upload.btn {
        padding: 0 12px;
        height: 36px;
      }

      .example-dropdown {
        max-width: calc(100vw - 32px);
      }

      .smallify-btn {
        height: 36px;
        width: 72px;
      }

      #smallifyImgBig {
        height: 20px;
      }

      #smallifyImgSmall {
        height: 13px;
      }

      #loadingVideo {
        width: 100%;
        max-width: 100%;
        max-height: 200px;
      }

      :root {
        --ctrl-height: 36px;
        --tja-left-width: 100%;
      }
    }
  </style>
</head>

<body>
    <!-- 侧边栏开关按钮 -->
  <button id="sidebarToggle" class="sidebar-toggle">☰</button>

  <!-- 侧边栏 -->
  <div id="sidebar" class="sidebar">
    <button class="sidebar-menu-btn active" data-page="taiko">谱面生成</button>
    <button class="sidebar-menu-btn" data-page="nameplate">歌曲名牌</button>
  </div>
  <div class="app-container layout-ox" id="appContainer">
    <!-- 头部 -->
    <div class="app-header">
      <h1>太鼓之达人图像生成器</h1>
      <p class="subtitle">Made by Doveon a.k.a meの我 & Copilot & Deepseek</p>
    </div>

    <!-- 预览区 -->
    <div class="preview-outer" id="previewContainer">
      <div class="preview-checkboxes">
        <label><input type="checkbox" id="mergeViewCheckbox" checked /> 多行合并</label>
        <label><input type="checkbox" id="bgMergeCheckbox" /> 透明背景</label>
        <label><input type="checkbox" id="showTrackCheckbox" checked /> 显示轨道</label>
      </div>
      <div style="text-align:center;color:var(--preview-text);padding:30px;" id="placeholder">
        输入音符字符串开始预览
      </div>
      <div id="loadingOverlay">
        <video id="loadingVideo" src="img/loading.mp4" preload="auto" loop muted playsinline width="390" height="195"></video>
      </div>
    </div>

    <!-- 输入区 -->
    <div class="input-section">
      <div class="input-row">
        <div class="textarea-wrapper">
          <textarea id="inputString" placeholder="" wrap="off"></textarea>
        </div>
      </div>
      <div class="controls-row" id="controlsRow">
        <button class="btn" id="btnModeSwitch">切换到TJA模式</button>
        <span class="file-upload btn tja-only" id="tjaUploadBtn">
          📂 加载TJA
          <input type="file" id="tjaFileInput" accept=".tja,.txt" />
        </span>
        <div class="control-item" id="hsControlItem">
          <label for="hsInput" style="font-weight:bold;">HS</label>
          <input type="number" id="hsInput" value="1.0" step="0.1" min="0.1" />
        </div>
        <button id="btnRandom" class="icon-btn" title="随机">
          <img src="img/Icon/Random.png" alt="随机" />
        </button>
        <button id="invertToggle" class="icon-btn" title="颠倒">
          <img src="img/Icon/Abekobe.png" alt="颠倒" />
        </button>
        <button class="icon-btn" id="btnStyleSwitch" title="切换样式">
          🎨
        </button>
        <button id="smallifyBtn" class="smallify-btn" title="大音符→小音符">
          <img id="smallifyImgBig" src="img/0/oo.png" alt="大" /><span class="arrow">→</span><img id="smallifyImgSmall" src="img/0/o.png" alt="小" />
        </button>
        <button class="btn tja-only" id="btnHsAdjust" title="HS调整">HS调整</button>
        <button class="btn tja-only" id="btnFixedBpm" title="流速固定">流速固定</button>
        <button class="btn" id="btnClearBars">清除标记</button>
        <button class="btn" id="btnHighlightSelection">高亮选中部分</button>
        <button class="btn tja-only" id="btnIgnoreScroll">注重目视</button>
        <button class="btn" id="btnResetView">显示原谱</button>
        <button class="btn tja-only" id="btnOptions">其他选项</button>
        <button class="btn" id="btnTJAtoText" style="display:none;">TJA转ox</button>
        <div style="position:relative; display:inline-block;">
          <button class="btn" id="exampleDropdownBtn">📋 快捷示例</button>
          <div class="example-dropdown" id="exampleDropdown"></div>
        </div>
        <button class="btn btn-primary" id="btnDownloadImage">下载图片</button>
      </div>
      <div id="courseContainer" style="display:none;" class="course-row"></div>
    </div>

    <!-- 谱面分歧警告 -->
    <div id="divergenceWarning" style="display:none;">暂不支持谱面分歧</div>

    <!-- 信息栏 -->
    <div class="info-bar" id="infoBar"></div>

    <!-- 图例/教程区 -->
    <div class="legend-bottom" id="legendBox">
      <span>高亮：<code>*</code> 后首个音符发光</span>
      <span>半透明：<code>~</code> 后首个音符半透明</span>
      <span>小节线：<code>|</code></span>
      <span>默认间隔16分</span>
      <span><code>( )</code> ×1.5</span>
      <span><code>[ ]</code> ×2</span>

     function replaceChineseNotes(str) {
    let result = str;
    // 将所有键按长度降序排列，保证多字符母串先替换
    const keys = Object.keys(chineseNoteMap).sort((a, b) => b.length - a.length);
    for (const ch of keys) {
        const replacement = chineseNoteMap[ch];
        result = result.replaceAll(ch, replacement);
    }
    return result;
}

      function normalize(s) {
        return s.replace(/（/g, '(').replace(/）/g, ')').replace(/【/g, '[').replace(/】/g, ']').replace(/｛/g, '{').replace(/｝/g, '}').replace(/，/g, ' ').replace(/,/g, ' ');
      }

      function getGapFactor(a, b) {
        let r = 1;
        const set = new Set();
        for (let i = 1; i < b.length; i++)
          if (typeof b[i] === 'object' && b[i].id != null) set.add(b[i].id);
        for (let i = 1; i < a.length; i++)
          if (typeof a[i] === 'object' && a[i].id != null && set.has(a[i].id)) r *= a[i].value;
        return r;
      }

      function parseGlobal(input) {
        const norm = normalize(input);
        const rows = [];
        let cur = [];
        const typeStack = [],
          factStack = [];
        let pendHigh = false,
          pendBar = false,
          pendTransparent = false,
          bracketIdCounter = 0;
        const curlLeftStack = [],
          sliderStack = [],
          curlIntervals = [];
        let globalIdx = 0;

        function push(e) {
          cur.push(e);
          globalIdx++;
          if (globalIdx > 1) curlIntervals.push(1);
        }

        function applyCurl(left, factor) {
          const right = globalIdx - 1;
          if (right < left) return;
          for (let i = left; i <= right - 1; i++) {
            if (i < curlIntervals.length) curlIntervals[i] *= factor;
          }
        }
        for (let i = 0; i < norm.length; i++) {
          const ch = norm[i];
          if (ch === '\n') {
            while (sliderStack.length) sliderStack.pop().el.hasTail = false;
            if (cur.length) rows.push(cur);
            cur = [];
            if (!'()[]{}'.includes(ch)) {
              pendHigh = false;
              pendBar = false;
            }
            continue;
          }
          if (ch === '*') {
            pendHigh = true;
            continue;
          }
          if (ch === '~') {
            pendTransparent = true;
            continue;
          }
          if (ch === '|' || ch === '/' || ch === '\\') {
            pendBar = true;
            continue;
          }
          if ('oxOXc -+=lL'.includes(ch) || ch === ' ') {
            let elType;
            if (ch === ' ') elType = 'space';
            else if (ch === '-') elType = 'sliderBody';
            else if (ch === '=') elType = 'bigSliderBody';
            else if (ch === '+') elType = 'balloonBody';
            else elType = ch;
            const el = {
              type: elType,
              pathFactors: [1, ...factStack],
              highlight: false,
              hasBar: false,
              curlGapToNext: 1
            };
            if (pendHigh) {
              if (ch !== ' ') el.highlight = true;
              pendHigh = false;
            }
            // 半透明效果（~ 作用域）
            if (pendTransparent) {
              // 只对实际绘制的音符生效（排除空格、滑块/气球身体）
              if (elType !== 'space' && elType !== 'sliderBody' && elType !== 'bigSliderBody' && elType !== 'balloonBody') {
                el.transparent = true;
              }
              pendTransparent = false;
            }
            if (pendBar) {
              el.hasBar = true;
              pendBar = false;
            }
            if (ch === 'l' || ch === 'L') {
              const isBig = ch === 'L';
              el.isSlider = true;
              el.isBig = isBig;
              if (sliderStack.length === 0 || sliderStack[sliderStack.length - 1].el.type !== ch) {
                const id = bracketIdCounter++;
                el.sliderRole = 'head';
                el.sliderId = id;
                el.hasTail = true;
                sliderStack.push({
                  el,
                  id
                });
              } else {
                const head = sliderStack.pop();
                el.sliderRole = 'tail';
                el.pairId = head.id;
              }
            }
            push(el);
            continue;
          }
          if (ch === '(') {
              typeStack.push('(');
              factStack.push({ value: 2 / 3, id: bracketIdCounter++ });
              continue;   // 防止执行到 pendHigh = pendBar = false
          } else if (ch === '[') {
              typeStack.push('[');
              factStack.push({ value: 1 / 2, id: bracketIdCounter++ });
              continue;
          } else if (ch === '{') {
              curlLeftStack.push({ startGlobalIndex: globalIdx });
              continue;
          }
          if (ch === ')' || ch === ']' || ch === '}') {
            if (ch === '}') {
              let j = i + 1,
                num = '';
              while (j < norm.length && (norm[j].match(/[0-9.]/) || norm[j] === '.')) {
                if (norm[j] !== '\n') num += norm[j];
                j++;
              }
              const y = parseFloat(num) || 16,
                f = 16 / y;
              if (curlLeftStack.length) {
                const top = curlLeftStack[curlLeftStack.length - 1];
                const left = top.startGlobalIndex;
                if (globalIdx - left === 1 && curlLeftStack.length >= 2) {
                  const second = curlLeftStack[curlLeftStack.length - 2];
                  applyCurl(second.startGlobalIndex, f);
                  curlLeftStack.splice(curlLeftStack.length - 2, 1);
                } else {
                  applyCurl(left, f);
                  curlLeftStack.pop();
                }
              }
              i = j - 1;
            } else {
              const expected = ch === ')' ? '(' : '[';
              const idx = typeStack.lastIndexOf(expected);
              if (idx !== -1) {
                typeStack.splice(idx, 1);
                factStack.splice(idx, 1);
              }
            }
            continue;
          }
          pendHigh = pendBar = false;
        }
        while (sliderStack.length) sliderStack.pop().el.hasTail = false;
        if (cur.length) rows.push(cur);
        let idx = 0;
        for (const r of rows) {
          for (let i = 0; i < r.length; i++) {
            r[i].curlGapToNext = idx < curlIntervals.length ? curlIntervals[idx++] : 1;
          }
        }
        return rows.filter(r => r.length > 0);
      }

      function buildRowSliders(elements) {
        const sliders = [],
          balloons = [];
        const sliderMap = new Map(),
          balloonMap = new Map();
        for (let i = 0; i < elements.length; i++) {
          const el = elements[i];
          if (el.isSlider) {
            const id = el.sliderId ?? el.pairId;
            if (!sliderMap.has(id)) sliderMap.set(id, {
              sliderId: id,
              headIdx: -1,
              tailIdx: -1,
              isBig: el.isBig
            });
            const obj = sliderMap.get(id);
            if (el.sliderRole === 'head') obj.headIdx = i;
            if (el.sliderRole === 'tail') obj.tailIdx = i;
          }
          if (el.isBalloon) {
            const id = el.sliderId ?? el.pairId;
            if (!balloonMap.has(id)) balloonMap.set(id, {
              sliderId: id,
              headIdx: -1,
              tailIdx: -1,
              isBalloon: true
            });
            const obj = balloonMap.get(id);
            if (el.sliderRole === 'head') obj.headIdx = i;
            if (el.sliderRole === 'tail') obj.tailIdx = i;
          }
        }
        sliderMap.forEach(v => sliders.push(v));
        balloonMap.forEach(v => balloons.push(v));
        return { sliders, balloons };
      }

      function getElementBounds(el, pos) {
        if (el.type === 'space') return { left: pos, right: pos + IMG_SMALL };
        if (el.type === 'sliderBody' || el.type === 'bigSliderBody' || el.type === 'balloonBody') return { left: pos, right: pos + IMG_SMALL };
        if (el.isSlider) {
          const isBig = el.isBig;
          if (el.sliderRole === 'head') {
            const ox = isBig ? -(IMG_BIG - IMG_SMALL) / 2 : 0;
            const size = isBig ? IMG_BIG : IMG_SMALL;
            return { left: pos + ox, right: pos + ox + size };
          } else if (el.sliderRole === 'tail') {
            if (isBig) {
              const ox = -(IMG_BIG - IMG_SMALL) / 2;
              return { left: pos + ox, right: pos + ox + IMG_BIG };
            } else return { left: pos, right: pos + IMG_SMALL };
          }
        }
        if (el.isBalloon) {
          if (el.sliderRole === 'head') return { left: pos - 0.5, right: pos - 0.5 + IMG_BALLOON_W };
          else if (el.sliderRole === 'tail') return { left: pos, right: pos + IMG_SMALL };
        }
        const isBig = el.type === 'O' || el.type === 'X';
        const ox = isBig ? -(IMG_BIG - IMG_SMALL) / 2 : 0;
        const size = isBig ? IMG_BIG : IMG_SMALL;
        return { left: pos + ox, right: pos + ox + size };
      }

      function getElementCenter(el, pos) {
        if (!el) return pos + IMG_SMALL / 2;
        if (el.type === 'space' || el.type === 'sliderBody' || el.type === 'bigSliderBody' || el.type === 'balloonBody')
          return pos + IMG_SMALL / 2;
        if (el.isSlider) {
          const isBig = el.isBig;
          if (el.sliderRole === 'head') {
            const ox = isBig ? -(IMG_BIG - IMG_SMALL) / 2 : 0;
            const size = isBig ? IMG_BIG : IMG_SMALL;
            return pos + ox + size / 2;
          } else if (el.sliderRole === 'tail') {
            if (isBig) {
              const ox = -(IMG_BIG - IMG_SMALL) / 2;
              return pos + ox + IMG_BIG / 2;
            } else return pos + IMG_SMALL / 2;
          }
        }
        if (el.isBalloon) {
          return pos + IMG_SMALL / 2;
        }
        const isBig = el.type === 'O' || el.type === 'X';
        const ox = isBig ? -(IMG_BIG - IMG_SMALL) / 2 : 0;
        const size = isBig ? IMG_BIG : IMG_SMALL;
        return pos + ox + size / 2;
      }

      function layoutLine(elements, hsScale, baseGap) {
        const pos = [];
        const { sliders, balloons } = buildRowSliders(elements);
        const insideSet = new Set(),
          headSet = new Set(),
          tailSet = new Set(),
          tailInfoMap = new Map();
        for (const s of sliders) {
          headSet.add(s.headIdx);
          tailSet.add(s.tailIdx);
          tailInfoMap.set(s.tailIdx, { headIdx: s.headIdx, tailIdx: s.tailIdx });
          for (let i = s.headIdx + 1; i < s.tailIdx; i++) insideSet.add(i);
        }
        for (const b of balloons) {
          headSet.add(b.headIdx);
          tailSet.add(b.tailIdx);
          tailInfoMap.set(b.tailIdx, { headIdx: b.headIdx, tailIdx: b.tailIdx });
          for (let i = b.headIdx + 1; i < b.tailIdx; i++) insideSet.add(i);
        }
        let x = 0,
          prevGapSource = null;
        const unitGap = (baseGap || DEFAULT_GAP) * hsScale;
        for (let i = 0; i < elements.length; i++) {
          const el = elements[i];
          const isHead = headSet.has(i),
            isTail = tailSet.has(i),
            isInside = insideSet.has(i);
          if (isHead) {
            if (prevGapSource) {
              const gap = (baseGap || DEFAULT_GAP) * (prevGapSource?.scrollFactor ?? 1) * getGapFactor(prevGapSource.pathFactors, el.pathFactors) * hsScale * (prevGapSource.curlGapToNext || 1);
              x += gap;
            }
            pos.push(x);
            prevGapSource = el;
            continue;
          }
          if (isInside) {
            const pair = [...tailInfoMap.values()].find(p => i > p.headIdx && i < p.tailIdx);
            if (pair) {
              const headPos = pos[pair.headIdx];
              pos.push(headPos + (i - pair.headIdx) * unitGap);
            } else pos.push(x);
            continue;
          }
          if (isTail) {
            const pair = tailInfoMap.get(i);
            if (pair) {
              const headPos = pos[pair.headIdx];
              x = headPos + (pair.tailIdx - pair.headIdx) * unitGap;
            }
            pos.push(x);
            prevGapSource = el;
            continue;
          }
          if (prevGapSource) {
            const gap = (baseGap || DEFAULT_GAP) * (prevGapSource?.scrollFactor ?? 1) * getGapFactor(prevGapSource.pathFactors, el.pathFactors) * hsScale * (prevGapSource.curlGapToNext || 1);
            x += gap;
          }
          pos.push(x);
          prevGapSource = el;
        }
        let minX = Infinity,
          maxX = -Infinity,
          first = IMG_SMALL / 2;
        elements.forEach((el, idx) => {
          const bounds = getElementBounds(el, pos[idx]);
          if (bounds.left < minX) minX = bounds.left;
          if (bounds.right > maxX) maxX = bounds.right;
          if (idx === 0) first = pos[idx] + IMG_SMALL / 2;
        });
        if (!isFinite(minX)) {
          minX = 0;
          maxX = IMG_SMALL;
        }
        return {
          elements,
          positions: pos,
          minX,
          maxX,
          width: maxX - minX,
          height: FIXED_HEIGHT,
          firstNoteCanvasX: first - minX,
          firstNoteCanvasY: 97.5
        };
      }

      function invertType(t, inv) {
        if (!inv || t === 'c') return t;
        return { o: 'x', x: 'o', O: 'X', X: 'O' }[t] || t;
      }

      function smallifyType(t) {
        return t === 'O' ? 'o' : t === 'X' ? 'x' : t;
      }

      function drawLine(canvas, layout, doInvert, doSmallify, randomRow, hideBars, balloonTail, gogoActive, showTrack) {
        const getActualStyle = (el, currentStyle) => {
          if (tjaModeActive && currentStyle === 1 && el && el.gogo) {
            return 2;
          }
          return currentStyle;
        };
        const ctx = canvas.getContext('2d');
        canvas.width = Math.ceil(layout.width);
        canvas.height = ROW_TOTAL_HEIGHT + (layout.bpmList ? 90 : 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (showTrack) {
          if (gogoActive) {
            if (layout.segments && layout.segments.length) {
              for (const seg of layout.segments) {
                ctx.fillStyle = getGogoBgColor(layout.branchType || 'COMMON', seg.gogo);
                ctx.fillRect(seg.startX, 0, seg.endX - seg.startX, FIXED_HEIGHT);
              }
            } else {
              ctx.fillStyle = getGogoBgColor(layout.branchType || 'COMMON', false);
              ctx.fillRect(0, 0, canvas.width, FIXED_HEIGHT);
            }
          } else {
            ctx.fillStyle = getGogoBgColor(layout.branchType || 'COMMON', false);
            ctx.fillRect(0, 0, canvas.width, FIXED_HEIGHT);
          }
          ctx.fillStyle = '#000000';
          ctx.fillRect(0, FIXED_HEIGHT, canvas.width, DECORATION_BLACK);

          // 根据 scroll 分段绘制灰色条
          const grayY = FIXED_HEIGHT + DECORATION_BLACK;
          if (layout.scrollSegments && !visualFocusActive) {
              // 根据分段绘制不同颜色的灰色条
              for (const seg of layout.scrollSegments) {
                  ctx.fillStyle = seg.isNotOne ? '#aaaaaa' : '#818181';
                  ctx.fillRect(seg.startX, grayY, seg.endX - seg.startX, DECORATION_GRAY);
              }
          } else {
              // 无分段或注重目视开启时，保持默认深灰色
              ctx.fillStyle = '#818181';
              ctx.fillRect(0, grayY, canvas.width, DECORATION_GRAY);
          }
        }
        if (!hideBars) {
          for (let i = 0; i < layout.elements.length; i++) {
            const el = layout.elements[i];
            if (!el.hasBar) continue;
            const cx = layout.positions[i] + IMG_SMALL / 2 - layout.minX;
            if (barImage.complete && barImage.naturalWidth > 0) {
              const bw = barImage.naturalWidth || 5,
                bh = barImage.naturalHeight || 200;
              ctx.drawImage(barImage, cx - bw / 2, 97.5 - bh / 2, bw, bh);
            }
          }
        }
        const { sliders = [], balloons = [] } = layout.sliderData || buildRowSliders(layout.elements);
        const ignoredIndices = new Set();
        for (const pair of [...sliders, ...balloons]) {
          if (pair.headIdx === -1 || pair.tailIdx === -1) continue;
          for (let i = pair.headIdx + 1; i < pair.tailIdx; i++) ignoredIndices.add(i);
        }
        const items = [];
        for (let i = 0; i < layout.elements.length; i++) {
          const el = layout.elements[i];
          if (el.type === 'space' || el.sliderRole === 'tail') continue;
          if (ignoredIndices.has(i)) continue;
          if (el.type === 'sliderBody' || el.type === 'bigSliderBody' || el.type === 'balloonBody') continue;
          let dt = el.type;
          if (randomRow && randomRow[i]) dt = invertType(dt, true);
          dt = invertType(dt, doInvert);
          if (doSmallify && dt !== 'c') dt = smallifyType(dt);
          const isBig = dt === 'O' || dt === 'X';
          const size = dt === 'c' ? IMG_BALLOON_W : (isBig ? IMG_BIG : IMG_SMALL);
          const ox = dt === 'c' ? -0.5 : (isBig ? -(IMG_BIG - IMG_SMALL) / 2 : 0);
          const x = layout.positions[i] + ox;
          const actualStyle = getActualStyle(el, currentStyle);
          const S = styleImages[actualStyle];
          const img = dt === 'c' ? S.c1 : { o: S.o, x: S.x, O: S.oo, X: S.xx }[dt];
          items.push({
            order: i,
            draw: () => {
              ctx.save();
              ctx.translate(-layout.minX, 0);
              if (el.highlight) {
                ctx.shadowColor = 'white';
                ctx.shadowBlur = 20;
              }
              if (el.transparent) {
                ctx.globalAlpha = 0.5;
              }
              if (img && img.complete) {
                if (dt === 'c') ctx.drawImage(img, x, 97.5 - IMG_BALLOON_H / 2, size, IMG_BALLOON_H);
                else ctx.drawImage(img, x, 97.5 - size / 2, size, size);
              }
              if (el.highlight) {
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
              }
              ctx.restore();
            }
          });
        }
        const bpm = layout.bpm;
        const startBarX = layout.startBarCanvasX ?? 0;
        const endBarX = layout.endBarCanvasX ?? layout.width;
        for (const s of sliders) {
          let isBig = s.isBig;
          if (doSmallify) isBig = false;
          const hSize = isBig ? IMG_BIG : IMG_SMALL,
            midH = isBig ? 160 : 106,
            tSize = isBig ? IMG_BIG : IMG_SMALL;
          const headEl = (s.headIdx !== -1) ? layout.elements[s.headIdx] : (s.tailIdx !== -1 ? layout.elements[s.tailIdx] : null);
          const tailEl = (s.tailIdx !== -1) ? layout.elements[s.tailIdx] : null;
          const isTransparent = headEl?.transparent ?? false;
          const gogoVal = headEl ? headEl.gogo : false;
          const actualStyle = getActualStyle({ gogo: gogoVal }, currentStyle);
          const S = styleImages[actualStyle];
          const hImg = isBig ? S.ll1 : S.l1,
            mImg = isBig ? S.ll2 : S.l2,
            tImg = isBig ? S.ll3 : S.l3;
          const headOnly = s.headIdx !== -1 && s.tailIdx === -1;
          const tailOnly = s.headIdx === -1 && s.tailIdx !== -1;
          if (headOnly) {
            const headX = layout.positions[s.headIdx] + IMG_SMALL / 2;
            const headCanvasX = headX - layout.minX;
            const bodyWidth = endBarX - headCanvasX;
            items.push({
              order: s.headIdx,
              draw: () => {
                if (isTransparent) ctx.globalAlpha = 0.5;
                ctx.save();
                ctx.translate(-layout.minX, 0);
                ctx.drawImage(mImg, headX, 97.5 - midH / 2, bodyWidth, midH);
                ctx.drawImage(hImg, headX - hSize / 2, 97.5 - hSize / 2, hSize, hSize);
                ctx.restore();
              }
            });
            continue;
          }
          if (tailOnly) {
            const tailX = layout.positions[s.tailIdx] + IMG_SMALL / 2;
            const tailCanvasX = tailX - layout.minX;
            const bodyWidth = tailCanvasX - startBarX;
            const bodyStartOriginal = startBarX + layout.minX;
            items.push({
              order: s.tailIdx,
              draw: () => {
                if (isTransparent) ctx.globalAlpha = 0.5;
                ctx.save();
                ctx.translate(-layout.minX, 0);
                ctx.drawImage(mImg, bodyStartOriginal, 97.5 - midH / 2, bodyWidth, midH);
                ctx.drawImage(tImg, tailX - tSize / 2, 97.5 - tSize / 2, tSize, tSize);
                ctx.restore();
              }
            });
            continue;
          }
          if (s.headIdx !== -1 && s.tailIdx !== -1) {
            const headX = layout.positions[s.headIdx] + IMG_SMALL / 2,
              tailX = layout.positions[s.tailIdx] + IMG_SMALL / 2;
            items.push({
              order: s.headIdx,
              draw: () => {
                if (isTransparent) ctx.globalAlpha = 0.5;
                ctx.save();
                ctx.translate(-layout.minX, 0);
                ctx.drawImage(hImg, headX - hSize / 2, 97.5 - hSize / 2, hSize, hSize);
                ctx.restore();
              }
            });
            items.push({
              order: s.headIdx + 1,
              draw: () => {
                if (isTransparent) ctx.globalAlpha = 0.5;
                ctx.save();
                ctx.translate(-layout.minX, 0);
                ctx.drawImage(mImg, headX, 97.5 - midH / 2, tailX - headX, midH);
                ctx.restore();
              }
            });
            items.push({
              order: s.tailIdx,
              draw: () => {
                if (isTransparent) ctx.globalAlpha = 0.5;
                ctx.save();
                ctx.translate(-layout.minX, 0);
                ctx.drawImage(tImg, tailX - tSize / 2, 97.5 - tSize / 2, tSize, tSize);
                ctx.restore();
              }
            });
          }
        }
        if (layout.crossSliders) {
          for (const cs of layout.crossSliders) {
            const actualStyle = getActualStyle({ gogo: cs.gogo }, currentStyle);
            const S = styleImages[actualStyle];

            if (cs.isBalloon) {
              if (cs.type === "middle") items.push({
                order: -9999,
                draw: () => {
                  if (isTransparent) ctx.globalAlpha = 0.5;
                  ctx.save();
                  ctx.translate(-layout.minX, 0);
                  ctx.globalAlpha = 0.7;
                  ctx.drawImage(S.c2, startBarX + layout.minX, 73.5, endBarX - startBarX, 48);
                  ctx.globalAlpha = 1;
                  ctx.restore();
                }
              });
              continue;
            }
            if (cs.type !== 'middle') continue;
            const mImg = cs.isBig ? S.ll2 : S.l2,
              midH = cs.isBig ? 160 : 106;
            items.push({
              order: -9999,
              draw: () => {
                if (isTransparent) ctx.globalAlpha = 0.5;
                ctx.save();
                ctx.translate(-layout.minX, 0);
                ctx.drawImage(mImg, startBarX + layout.minX, 97.5 - midH / 2, endBarX - startBarX, midH);
                ctx.restore();
              }
            });
          }
        }
        if (balloonTail) {
          for (const b of balloons) {
            const headOnly = b.headIdx !== -1 && b.tailIdx === -1;
            const tailOnly = b.headIdx === -1 && b.tailIdx !== -1;
            const complete = b.headIdx !== -1 && b.tailIdx !== -1;
            const headEl = (b.headIdx !== -1) ? layout.elements[b.headIdx] : null;
            const isTransparent = headEl?.transparent;
            const gogoVal = headEl ? headEl.gogo : false;
            const actualStyle = getActualStyle({ gogo: gogoVal }, currentStyle);
            const c2 = styleImages[actualStyle].c2;
            const c3 = styleImages[actualStyle].c3;

            if (headOnly) {
              const headX = layout.positions[b.headIdx] + IMG_SMALL / 2;
              const headCanvasX = headX - layout.minX;
              const bodyWidth = endBarX - headCanvasX;
              items.push({
                order: b.headIdx + 1,
                draw: () => {
                  if (isTransparent) ctx.globalAlpha = 0.5;
                  ctx.save();
                  ctx.translate(-layout.minX, 0);
                  ctx.globalAlpha = 0.7;
                  ctx.drawImage(c2, headX, 73.5, bodyWidth, 48);
                  ctx.globalAlpha = 1;
                  ctx.restore();
                }
              });
              continue;
            }

            if (tailOnly) {
              const tailX = layout.positions[b.tailIdx] + IMG_SMALL / 2;
              const tailCanvasX = tailX - layout.minX;
              const bodyWidth = tailCanvasX - startBarX;
              const bodyStartOriginal = startBarX + layout.minX;
              items.push({
                order: b.tailIdx,
                draw: () => {
                  if (isTransparent) ctx.globalAlpha = 0.5;
                  ctx.save();
                  ctx.translate(-layout.minX, 0);
                  ctx.globalAlpha = 0.7;
                  ctx.drawImage(c2, bodyStartOriginal, 73.5, bodyWidth, 48);
                  ctx.drawImage(c3, tailX - 24, 73.5, 48, 48);
                  ctx.globalAlpha = 1;
                  ctx.restore();
                }
              });
              continue;
            }

            if (complete) {
              const headX = layout.positions[b.headIdx] + IMG_SMALL / 2;
              const tailX = layout.positions[b.tailIdx] + IMG_SMALL / 2;
              items.push({
                order: b.headIdx + 0.5,
                draw: () => {
                  if (isTransparent) ctx.globalAlpha = 0.5;
                  ctx.save();
                  ctx.translate(-layout.minX, 0);
                  ctx.globalAlpha = 0.7;
                  ctx.drawImage(c2, headX, 73.5, tailX - headX, 48);
                  ctx.globalAlpha = 1;
                  ctx.restore();
                }
              });
              items.push({
                order: b.tailIdx,
                draw: () => {
                  if (isTransparent) ctx.globalAlpha = 0.5;
                  ctx.save();
                  ctx.translate(-layout.minX, 0);
                  ctx.globalAlpha = 0.7;
                  ctx.drawImage(c3, tailX - 24, 73.5, 48, 48);
                  ctx.globalAlpha = 1;
                  ctx.restore();
                }
              });
            }
          }
        }
        if (layout.bpmList) {
          const lineTop = FIXED_HEIGHT + DECORATION_BLACK;
          const lineHeight = 90;
          const textY = ROW_TOTAL_HEIGHT;
          layout.bpmList.forEach((bpm) => {
            const bpmX = bpm.x;
            if (barImage.complete && barImage.naturalWidth > 0) {
              const bw = barImage.naturalWidth;
              ctx.drawImage(barImage, bpmX - bw / 2, lineTop, bw, lineHeight);
            }
            ctx.save();
            ctx.font = 'bold 36px "FZYuan", sans-serif';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;
            ctx.textBaseline = 'top';
            const bpmText = bpm.value.toFixed(2);
            ctx.strokeText(bpmText, bpmX + 4, textY);
            ctx.fillStyle = '#ffffff';
            ctx.fillText(bpmText, bpmX + 4, textY);
            ctx.restore();
          });
        }
        if (layout.scrollList) {
            const lineTop = FIXED_HEIGHT + DECORATION_BLACK;
            const lineBottom = FIXED_HEIGHT + DECORATION_BLACK + DECORATION_GRAY;
            const textY = lineTop + (DECORATION_GRAY / 2);

            layout.scrollList.forEach((sc) => {
                const x = sc.x;
                const scrollVal = sc.value;

                ctx.beginPath();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.moveTo(x, lineTop);
                ctx.lineTo(x, lineBottom);
                ctx.stroke();

                if (Math.abs(scrollVal - 1) > 0.001) {
                    if (Math.abs(scrollVal - 1) > 0.001) {
                      ctx.save();
                      ctx.font = 'italic bold 30px "FZYuan", sans-serif';
                      ctx.textAlign = 'left';
                      ctx.textBaseline = 'middle';
                      const scrollText = scrollVal.toFixed(2);
                      const textMetrics = ctx.measureText(scrollText);
                      const textWidth = textMetrics.width;
                      const textHeight = 30;                      // 近似字体大小
                      const paddingX = 8;
                      const paddingY = 4;

                      ctx.fillStyle = '#fed218';
                      ctx.fillRect(
                          x + 4 - paddingX,
                          textY - textHeight/2 - paddingY,
                          textWidth + paddingX * 2,
                          textHeight + paddingY * 2
                      );

                      // 绘制文字（描边 + 填充）
                      ctx.strokeStyle = '#ffffff';
                      ctx.lineWidth = 6;
                      ctx.strokeText(scrollText, x + 4, textY);
                      ctx.fillStyle = '#000000';
                      ctx.fillText(scrollText, x + 4, textY);

                      ctx.restore();
                  }
                }
            });
        }

        items.sort((a, b) => b.order - a.order);
        for (const item of items) item.draw();
      }

      function buildCanvasCacheKey(layout, doInvert, doSmallify, rowIndex) {
        return JSON.stringify({
          course: selectedCourse?.name,
          view: doubleViewMode,
          branch: layout.branchType,
          group: layout.groupIndex,
          rowIndex,
          hs: parseFloat(hsInput.value) || 1,
          doInvert,
          doSmallify,
          style: currentStyle,
          showBars,
          showBalloonTail,
          showTrack,
          showGogo,
          random: randomMap?.[rowIndex]?.join('') || ''
        });
      }

      function getGogoBgColor(branchType, gogo) {
        if (gogo) {
          if (branchType === 'M') return '#B90C5D';
          if (branchType === 'E') return '#543F5D';
          return '#900000';
        } else {
          if (branchType === 'M') return '#852071';
          if (branchType === 'E') return '#205371';
          return '#272727';

        const elements = group.elements,
          positions = group.positions;
        let minX = Infinity,
          maxX = -Infinity,
          first = IMG_SMALL / 2;
        elements.forEach((el, idx) => {
          const bounds = getElementBounds(el, positions[idx]);
          if (bounds.left < minX) minX = bounds.left;
          if (bounds.right > maxX) maxX = bounds.right;
          if (idx === 0) first = positions[idx] + IMG_SMALL / 2;
        });
        if (!isFinite(minX) || (positions.length > 0 && minX > positions[0])) minX = positions.length > 0 ? positions[0] : 0;
        if (minX === Infinity) {
          minX = 0;
          maxX = IMG_SMALL;
        }
        let startBarCanvasX = 0;
        let endBarCanvasX = (maxX - minX);
        let hasBar = false;
        let firstBarOriginal = null;
        let lastBarOriginal = null;
        for (let i = 0; i < elements.length; i++) {
          if (elements[i].hasBar) {
            const bx = positions[i] + IMG_SMALL / 2;
            if (firstBarOriginal === null || bx < firstBarOriginal) firstBarOriginal = bx;
            if (lastBarOriginal === null || bx > lastBarOriginal) lastBarOriginal = bx;
            hasBar = true;
          }
        }
        if (hasBar && firstBarOriginal !== null && lastBarOriginal !== null) {
          startBarCanvasX = firstBarOriginal - minX;
          endBarCanvasX = lastBarOriginal - minX;
        }
        const centers = [],
          gogoFlags = [];
        for (let i = 0; i < elements.length; i++) {
          if (elements[i]._virtualTail) continue;
          const cx = getElementCenter(elements[i], positions[i]);
          centers.push(cx);
          gogoFlags.push(!!elements[i].gogo);
        }
        const rawSegments = [];
        if (centers.length) {
          rawSegments.push({ start: minX, end: centers[0], gogo: gogoFlags[0] });
          for (let i = 0; i < centers.length - 1; i++) rawSegments.push({ start: centers[i], end: centers[i + 1], gogo: gogoFlags[i] });
          rawSegments.push({ start: centers[centers.length - 1], end: maxX, gogo: gogoFlags[gogoFlags.length - 1] });
        } else rawSegments.push({ start: minX, end: maxX, gogo: false });
        const mergedSegments = [];
        for (const seg of rawSegments) {
          if (!mergedSegments.length || mergedSegments[mergedSegments.length - 1].gogo !== seg.gogo)
            mergedSegments.push({ ...seg });
          else mergedSegments[mergedSegments.length - 1].end = seg.end;
        }
        const visualSegments = mergedSegments.map(s => ({
          gogo: s.gogo,
          startX: s.start - minX,
          endX: s.end - minX
        }));
        // 生成 scroll 分段（用于灰色条变色）
        
        // BPM 变化点列表
        let bpmList = [];
        let lastBpm = null;
        for (let i = 0; i < elements.length; i++) {
          if (elements[i]._virtualTail) continue;
          if (elements[i].bpm !== undefined && elements[i].bpm !== lastBpm) {
            const bpmX = positions[i] + IMG_SMALL / 2 - minX;
            bpmList.push({ value: elements[i].bpm, x: bpmX });
            lastBpm = elements[i].bpm;
          }
        }

        // SCROLL 变化点列表
        let scrollList = [];
        let lastScroll = null;
        for (let i = 0; i < elements.length; i++) {
          if (elements[i]._virtualTail) continue;
          const scrollVal = elements[i].scroll;
          if (scrollVal !== undefined && scrollVal !== lastScroll) {
            const scrollX = positions[i] + IMG_SMALL / 2 - minX;
            const displayValue = elements[i].scrollLabel !== undefined
                                ? elements[i].scrollLabel
                                : scrollVal;
            scrollList.push({ value: displayValue, x: scrollX });
            lastScroll = scrollVal;
          }
        }
        let scrollSegments = [];
        if (!visualFocusActive) {
          // 使用 group.startScroll 作为本段开始的 SCROLL 值（若未传入则默认 1）
          let prevScroll = group.startScroll ?? 1;
          let prevX = 0;
          // 遍历元素，按元素中心位置检测 scroll 变化点
          for (let i = 0; i < elements.length; i++) {
            if (elements[i]._virtualTail) continue;
            const scrollVal = elements[i].scroll !== undefined ? elements[i].scroll : prevScroll;
            const cx = positions[i] + IMG_SMALL / 2 - minX;   // 元素中心 x 坐标
            if (scrollVal !== prevScroll) {
              // 从 prevX 到 cx 这一段使用 prevScroll
              scrollSegments.push({
                startX: prevX,
                endX: cx,
                isNotOne: prevScroll !== 1
              });
              prevScroll = scrollVal;
              prevX = cx;
            }
          }
          // 最后一段：从最后一个变化点延伸到条的最右端
          scrollSegments.push({
            startX: prevX,
            endX: maxX - minX,
            isNotOne: prevScroll !== 1
          });
        }
        return {
          elements,
          positions,
          sliderData: buildRowSliders(elements),
          crossSliders: [],
          minX,
          maxX,
          width: maxX - minX,
          height: FIXED_HEIGHT,
          firstNoteCanvasX: first - minX,
          firstNoteCanvasY: 100,
          segments: visualSegments,
          startBarCanvasX,
          endBarCanvasX,
          bpmList: bpmList.length ? bpmList : null,
          scrollList: scrollList.length ? scrollList : null,
          scrollSegments: scrollSegments.length ? scrollSegments : null
        };
      }

      function buildCrossLayoutSliders(layouts) {
        const active = new Map();
        layouts.forEach((layout, layoutIndex) => {
          layout.crossSliders = [];
          layout.elements.forEach((el) => {
            if (!el.isSlider && !el.isBalloon) return;
            if (el.sliderRole === 'head') {
              const id = el.sliderId ?? el.pairId;
              active.set(id, {
                startLayout: layoutIndex,
                isBig: !!el.isBig,
                isBalloon: !!el.isBalloon,
                gogo: !!el.gogo
              });
            } else if (el.sliderRole === 'tail') {
              const id = el.sliderId ?? el.pairId,
                info = active.get(id);
              if (!info) return;
              for (let p = info.startLayout; p <= layoutIndex; p++) {
                let type;
                if (p === info.startLayout) type = "start";
                else if (p === layoutIndex) type = "end";
                else type = "middle";
                layouts[p].crossSliders.push({
                  sliderId: id,
                  isBig: info.isBig,
                  isBalloon: info.isBalloon,
                  type,
                  gogo: info.gogo
                });
              }
              active.delete(id);
            }
          });
        });
        active.forEach((info, id) => {
          for (let p = info.startLayout; p < layouts.length; p++) layouts[p].crossSliders.push({
            sliderId: id,
            isBig: info.isBig,
            isBalloon: info.isBalloon,
            type: p === info.startLayout ? "start" : "middle",
            gogo: info.gogo
          });
        });
      }

      function updateCourseButtons() {
        if (tjaCourses.length) selectedCourse = selectedCourse || tjaCourses[0];
        if (selectedCourse?.viewType === 'double') {
          const modes = getDoubleModes(selectedCourse);
          if (!modes.includes(doubleViewMode)) doubleViewMode = modes[0];
        }
        if (tjaCourses.length) {
          selectedCourse = selectedCourse || tjaCourses[0];
        }
        if (selectedCourse && !tjaCourses.includes(selectedCourse)) {
          selectedCourse = tjaCourses.length ? tjaCourses[0] : null;
        }
        courseContainer.innerHTML = '<span class="examples-label">难度选择：</span>';
        tjaCourses.forEach((c) => {
          const btn = document.createElement('button');
          btn.className = 'btn btn-example';
          const lv = c.level ? c.level : '';
          btn.textContent = c.name + (lv ? lv : '');
          if (c === selectedCourse) btn.classList.add('active');
          btn.addEventListener('click', () => {
            showLoading();
            selectedCourse = c;
            updateCourseButtons();
            render();
          });
          courseContainer.appendChild(btn);
        });
        if (selectedCourse?.hasBranch) {
          const btn = document.createElement('button');
          btn.className = 'btn btn-example';
          const label = branchViewMode === 'M' ? '达人' : branchViewMode === 'E' ? '玄人' : branchViewMode === 'N' ? '普通' : '合并';
          btn.textContent = label;
          btn.onclick = () => {
            showLoading();
            if (branchViewMode === 'M') branchViewMode = 'E';
            else if (branchViewMode === 'E') branchViewMode = 'N';
            else if (branchViewMode === 'N') branchViewMode = 'ALL';
            else branchViewMode = 'M';
            updateCourseButtons();
            render();
          };
          courseContainer.appendChild(btn);
        }
        if (selectedCourse?.viewType === 'double') {
          const btn = document.createElement('button');
          btn.className = 'btn btn-example';
          const isTagTeam = isTagTeamCourse(selectedCourse);
          const labelMap = {
            SINGLE: '单人',
            DOUBLE: isTagTeam ? '双打' : '双人',
            P1: 'P1',
            P2: 'P2',
            ALL: '合并'
          };
          btn.textContent = labelMap[doubleViewMode];
          btn.onclick = () => {
            showLoading();
            const modes = getDoubleModes(selectedCourse);
            let idx = modes.indexOf(doubleViewMode);
            if (idx === -1) idx = 0;
            idx = (idx + 1) % modes.length;
            doubleViewMode = modes[idx];
            updateCourseButtons();
            render();
          };
          courseContainer.appendChild(btn);
        }
        courseContainer.style.display = tjaCourses.length ? 'flex' : 'none';
      }

      function isTagTeamCourse(course) {
        return (course?.title && course.title.startsWith('【双打】'));
      }

      function updateTjaModeUI() {
        document.querySelectorAll('.tja-only').forEach(e => e.style.display = tjaModeActive ? 'inline-flex' : 'none');
        tjaUploadBtn.style.display = tjaModeActive ? 'inline-flex' : 'none';
        btnClearBars.style.display = tjaModeActive ? 'none' : 'inline-flex';
        btnIgnoreScroll.classList.toggle('active', visualFocusActive);
        legendBox.style.display = tjaModeActive ? 'none' : ''; 
        btnTJAtoText.style.display = 'none';
        hsControlItem.style.display = tjaModeActive ? 'none' : 'inline-flex';
        btnHighlightSelection.style.display = tjaModeActive ? 'none' : 'inline-flex';
        if (btnEditMap) btnEditMap.style.display = tjaModeActive ? 'none' : '';
        exampleDropdownBtn.style.display = tjaModeActive ? 'none' : 'inline-flex';
        textarea.placeholder = tjaModeActive ? '可粘贴tja文件内容或拖拽选择tja文件' : '输入ox字符串生成鱼蛋图片，如：(ooxooxooxooxooox)ox(ooox)ox(oxooox)';
        appContainer.classList.toggle('layout-tja', tjaModeActive);
        appContainer.classList.toggle('layout-ox', !tjaModeActive);
        if (tjaModeActive) {
          textarea.style.minHeight = '8em';
        } else {
          textarea.style.minHeight = '10em';
        }
      }

      let currentRowLayouts = [];

      function buildDoubleLayouts() {
        const hsScale = parseFloat(hsInput.value) || 1;
        let rowLayouts = [];
        if (doubleViewMode === 'SINGLE') {
          rowLayouts = getMergedRowsCached(selectedCourse.singleRows, hsScale, selectedCourse.name + '_SINGLE').layouts
        } else if (doubleViewMode === 'P1') {
          rowLayouts = getMergedRowsCached(selectedCourse.p1Rows, hsScale, selectedCourse.name + '_P1').layouts
        } else if (doubleViewMode === 'P2') {
          rowLayouts = getMergedRowsCached(selectedCourse.p2Rows, hsScale, selectedCourse.name + '_P2').layouts
        } else if (doubleViewMode === 'DOUBLE') {
          const branchMap = {
            P1: getMergedRowsCached(selectedCourse.p1Rows, hsScale, selectedCourse.name + '_P1').layouts,
            P2: getMergedRowsCached(selectedCourse.p2Rows, hsScale, selectedCourse.name + '_P2').layouts
          };
          const activeBranches = ['P1', 'P2'];
          let groupIndex = 0;
          const maxLines = Math.max(branchMap.P1.length, branchMap.P2.length);
          for (let i = 0; i < maxLines; i++) {
            const currentGroup = groupIndex++;
            for (const b of activeBranches) {
              if (branchMap[b][i]) {
                branchMap[b][i].branchType = b;
                branchMap[b][i].groupIndex = currentGroup;
                rowLayouts.push(branchMap[b][i]);
              }
            }
          }
        } else if (doubleViewMode === 'ALL') {
          const branchMap = {
            SINGLE: getMergedRowsCached(selectedCourse.singleRows, hsScale, selectedCourse.name + '_SINGLE').layouts,
            P1: getMergedRowsCached(selectedCourse.p1Rows, hsScale, selectedCourse.name + '_P1').layouts,
            P2: getMergedRowsCached(selectedCourse.p2Rows, hsScale, selectedCourse.name + '_P2').layouts
          };
          let activeBranches = doubleDisplayOrder.filter(v => v.visible).map(v => v.branch);
          if (!activeBranches.length) activeBranches = ['SINGLE', 'P1', 'P2'];
          let groupIndex = 0;
          const maxLines = Math.max(...activeBranches.map(b => branchMap[b].length));
          for (let i = 0; i < maxLines; i++) {
            const currentGroup = groupIndex++;
            for (const b of activeBranches) {
              if (branchMap[b][i]) {
                branchMap[b][i].branchType = b;
                branchMap[b][i].groupIndex = currentGroup;
                rowLayouts.push(branchMap[b][i]);
              }
            }
          }
        }
        currentRowLayouts = rowLayouts;
        if (mergeViewActive || !transparentBgActive) {
          for (let i = 0; i < rowLayouts.length - 1; i++) {
            if (rowLayouts[i].bpmList && rowLayouts[i + 1].groupIndex !== undefined &&
              rowLayouts[i].groupIndex === rowLayouts[i + 1].groupIndex) {
              rowLayouts[i].bpmList = null;
            }
          }
        }
        return rowLayouts;
      }

      function render() {
        let loadingToken;
        if (tjaModeActive) {
          loadingToken = showLoading();
        } else hideLoadingImmediate();
        let rowLayouts;
        const hsVal = parseFloat(hsInput.value) || 1,
          hsScale = hsVal > 0 ? hsVal : 1;
        const doInvert = invertActive,
          doSmall = smallifyActive;
        divergenceWarning.style.display = 'none';
        let inputValue = textarea.value.trim();
        if (!tjaModeActive && inputValue === '') {
          inputValue = '(ooxooxooxooxooox)ox(ooox)ox(oxooox)';
        }
        if (tjaModeActive && selectedCourse) {
          if (selectedCourse.viewType === 'double') {
            rowLayouts = buildDoubleLayouts(hsScale);
          } else if (selectedCourse.hasBranch && branchViewMode !== 'ALL') {
            const sourceRows = selectedCourse.rows.filter(row => row.branch === 'COMMON' || row.branch === branchViewMode);
            rowLayouts = getMergedRowsCached(sourceRows, hsScale, selectedCourse.name + '_BRANCH_' + branchViewMode).layouts;
          } else {
            rowLayouts = [];
            const sections = splitBranchSections(selectedCourse.rows);
            let groupIndex = 0;
            for (const section of sections) {
              if (section.type === 'COMMON') {
                const layouts = getMergedRowsCached(section.rows, hsScale, selectedCourse.name + '_COMMON_' + groupIndex).layouts;
                layouts.forEach(l => {
                  l.branchType = 'COMMON';
                  l.groupIndex = groupIndex++;
                });
                rowLayouts.push(...layouts);
              } else {
                const branches = splitBranchRows(section.rows);
                let activeBranches = [];
                if (branchViewMode === 'ALL') {
                  activeBranches = branchDisplayOrder.filter(b => b.visible).map(b => b.branch);
                } else {
                  activeBranches = [branchViewMode];
                }
                if (activeBranches.length === 0) activeBranches = ['M', 'E', 'N'];
                const branchMap = {
                  M: branches.M.length ? getMergedRowsCached(branches.M, hsScale, selectedCourse.name + '_M').layouts : [],
                  E: branches.E.length ? getMergedRowsCached(branches.E, hsScale, selectedCourse.name + '_E').layouts : [],
                  N: branches.N.length ? getMergedRowsCached(branches.N, hsScale, selectedCourse.name + '_N').layouts : []
                };
                const maxLines = Math.max(...activeBranches.map(b => branchMap[b].length));
                for (let i = 0; i < maxLines; i++) {
                  const currentGroup = groupIndex++;
                  for (const b of activeBranches) {
                    if (branchMap[b][i]) {
                      branchMap[b][i].branchType = b;
                      branchMap[b][i].groupIndex = currentGroup;
                      rowLayouts.push(branchMap[b][i]);
                    }
                  }
                }
              }
            }
          }
        } else {
          const rows = parseGlobal(replaceChineseNotes(inputValue));
          rowLayouts = rows.map(e => layoutLine(e, hsScale)).filter(l => l.elements.some(e => e.type !== 'space'));
        }
        currentRowLayouts = rowLayouts;
        infoBar.innerHTML = `行数:${rowLayouts.length} | 音符:${rowLayouts.reduce((s, l) => s + l.elements.filter(e => e.type !== 'space' || e.isSlider).length, 0)} | HS:${hsScale.toFixed(2)} | 样式:${currentStyle}`;
        previewContainer.querySelectorAll('.preview-row').forEach(el => el.remove());
        if (!rowLayouts.length) {
          placeholder.style.display = 'block';
          if (tjaModeActive) hideLoading(loadingToken);
          return;
        }
        placeholder.style.display = 'none';
        if (mergeViewActive || !transparentBgActive) {
          const rowCanvases = rowLayouts.map((l, i) => {
            const cacheKey = buildCanvasCacheKey(l, doInvert, doSmall, i);
            let c;
            if (canvasCache.has(cacheKey)) {
              c = canvasCache.get(cacheKey);
            } else {
              c = document.createElement('canvas');
              drawLine(c, l, doInvert, doSmall, randomMap?.[i], !showBars, showBalloonTail, showGogo, showTrack);
              canvasCache.set(cacheKey, c);
            }
            return { canvas: c, firstX: l.firstNoteCanvasX, firstY: 97.5 };
          });
          const maxFirstX = Math.max(...rowCanvases.map(r => r.firstX));
          const infoH = (tjaModeActive && selectedCourse) ? FIXED_HEIGHT : 0,
            musicY = infoH;
          const useGroupIndex = (tjaModeActive && selectedCourse?.hasBranch && branchViewMode === 'ALL') || (tjaModeActive && selectedCourse?.viewType === 'double' && (doubleViewMode === 'DOUBLE' || doubleViewMode === 'ALL'));
          let totalExtraGap = 0;
          for (let i = 0; i < rowLayouts.length - 1; i++) {
            if (useGroupIndex) {
              if (rowLayouts[i].groupIndex !== rowLayouts[i + 1].groupIndex) totalExtraGap += EXTRA_GAP_SAME_BRANCH;
            } else totalExtraGap += EXTRA_GAP_SAME_BRANCH;
          }
          let finalH = musicY + currentRowLayouts.length * ROW_TOTAL_HEIGHT + totalExtraGap;
          if (currentRowLayouts.length > 0) {
            const last = currentRowLayouts[currentRowLayouts.length - 1];
            if (last && last.bpmList) finalH += 90;
          }
          const maxW = Math.max(...rowCanvases.map((r, i) => (maxFirstX - r.firstX) + r.canvas.width));
          const mc = document.createElement('canvas');
          mc.width = Math.ceil(maxW);
          mc.height = Math.ceil(finalH);
          const ctx = mc.getContext('2d');
          if (!transparentBgActive) {
            ctx.fillStyle = '#151515';
            ctx.fillRect(0, 0, mc.width, mc.height);
          }
          if (tjaModeActive && selectedCourse) {
            const title = selectedCourse.title || '',
              diff = selectedCourse.name || '',
              lv = selectedCourse.level || '';
            let displayTitle = title;
            if (selectedCourse?.viewType === 'double') {
              const isTagTeam = isTagTeamCourse(selectedCourse);
              const labelMap = { SINGLE: '单人', DOUBLE: isTagTeam ? '双打' : '双人', P1: 'P1', P2: 'P2', ALL: '合并' };
              displayTitle = title + '(' + labelMap[doubleViewMode] + ')';
            } else if (selectedCourse.hasBranch && branchViewMode !== 'ALL') {
              const branchNames = { M: '達人', E: '玄人', N: '普通' };
              const branchName = branchNames[branchViewMode];
              if (branchName) displayTitle = title + '(' + branchName + ')';
            }
            const tags = [];
            if (visualFocusActive) tags.push('見た目重视');
            if (randomMap) tags.push('でたらめ');
            else if (invertActive) tags.push('あべこべ');
            const hsValNum = parseFloat(hsInput.value) || 1;
            if (Math.abs(hsValNum - 1) > 0.0001) tags.push(`HS:${hsValNum}`);
            if (fixedBpmActive) tags.push(`bpm${fixedBpmValue}固定`);
            const modifierText = tags.join(' ');
            ctx.save();
            const titleFont = userFontLoaded ? `"${userFontFamily}"` : '"DFPKanteiryu","KaiTi"';
            ctx.font = `bold 90px ${titleFont}, sans-serif`;
            ctx.fillStyle = '#e0d5c5';
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 4;
            ctx.fillText(displayTitle, 12, 90);
            if (diff || lv) {
              ctx.font = `bold 72px ${titleFont}, sans-serif`;
              let secondLine = diff + (lv ? lv : '');
              if (modifierText) secondLine += ' ' + modifierText;
              ctx.fillText(secondLine, 12, 180);
            }
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.restore();
          }
          let y = musicY;
          rowLayouts.forEach((l, i) => {
            ctx.drawImage(rowCanvases[i].canvas, maxFirstX - rowCanvases[i].firstX, y);
            if (i < rowLayouts.length - 1) {
              let gap;
              if (useGroupIndex) gap = (rowLayouts[i].groupIndex !== rowLayouts[i + 1].groupIndex) ? ROW_TOTAL_HEIGHT + EXTRA_GAP_SAME_BRANCH : ROW_TOTAL_HEIGHT;
              else gap = ROW_TOTAL_HEIGHT + EXTRA_GAP_SAME_BRANCH;
              y += gap;
            }
          });
          const div = document.createElement('div');
          div.className = 'preview-row';
          div.innerHTML = `<div class="preview-row-header"><span>${!transparentBgActive ? '暗色背景' : '透明背景'} (${rowLayouts.length}行)</span></div>`;
          const wrap = document.createElement('div');
          wrap.className = 'preview-canvas-wrapper';
          wrap.appendChild(mc);
          div.appendChild(wrap);
          previewContainer.appendChild(div);
          // 计算缩放比，使 canvas 宽度适配预览区
          const scale = Math.min(1, (previewContainer.clientWidth - 32) / maxW);
          mc.style.width = mc.width * scale + 'px';
          mc.style.height = mc.height * scale + 'px';
          mc.style.maxWidth = '100%';   // 允许缩小，但不撑破容器
          // 绑定点击事件打开大图弹窗
          mc.style.cursor = 'pointer';
          mc.addEventListener('click', () => openImagePreview(mc));
        } else {
          const maxFirstX = Math.max(...rowLayouts.map(l => l.firstNoteCanvasX));
          rowLayouts.forEach((l, i) => {
            const orig = document.createElement('canvas');
            drawLine(orig, l, doInvert, doSmall, randomMap?.[i], !showBars, showBalloonTail, showGogo, showTrack);
            const extra = maxFirstX - l.firstNoteCanvasX;
            const final = document.createElement('canvas');
            final.width = Math.ceil(extra + l.width);
            final.height = ROW_TOTAL_HEIGHT;
            final.getContext('2d').drawImage(orig, extra, 0);
            const div = document.createElement('div');
            div.className = 'preview-row';
            div.innerHTML = `<div class="preview-row-header"><span>第${i + 1}行 (${l.elements.filter(e => e.type !== 'space' || e.isSlider).length}音符)</span></div>`;
            const wrap = document.createElement('div');
            wrap.className = 'preview-canvas-wrapper';
            wrap.appendChild(final);
            div.appendChild(wrap);
            previewContainer.appendChild(div);
          });
          const allC = previewContainer.querySelectorAll('canvas:not(.preview-checkboxes canvas)');
          const maxW = Math.max(...Array.from(allC).map(c => c.width));
          const scale = Math.min(1, (previewContainer.clientWidth - 32) / maxW);
          allC.forEach(c => {
            c.style.width = c.width * scale + 'px';
            c.style.height = c.height * scale + 'px';
            c.style.maxWidth = '100%';
            // 点击弹窗大图
            c.style.cursor = 'pointer';
            c.addEventListener('click', () => openImagePreview(c));
          });
        }
        if (tjaModeActive) hideLoading(loadingToken);
      }

      function openOptionsModal() {
        optShowBars.checked = showBars;
        optShowBalloonTail.checked = showBalloonTail;
        optShowGogo.checked = showGogo;
        rebuildBranchOrderList();
        optionsModal.style.display = 'flex';
      }

      function rebuildBranchOrderList() {
        branchOrderList.innerHTML = '';
        const orderList = selectedCourse?.viewType === 'double' ? doubleDisplayOrder : branchDisplayOrder;
        orderList.forEach((item, index) => {
          const div = document.createElement('div');
          div.className = 'branch-item';
          div.draggable = true;
          div.dataset.branch = item.branch;
          div.innerHTML = `<span>☰</span><label>${item.label}</label><input type="checkbox" ${item.visible ? 'checked' : ''}>`;
          div.querySelector('input').addEventListener('change', (e) => {
            item.visible = e.target.checked;
          });
          div.addEventListener('dragstart', handleDragStart);
          div.addEventListener('dragover', (e) => e.preventDefault());
          div.addEventListener('drop', handleDrop);
          branchOrderList.appendChild(div);
        });
      }
      let draggedItem = null;

      function handleDragStart(e) {
        draggedItem = e.currentTarget;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', e.currentTarget.dataset.branch);
      }

      function handleDrop(e) {
        e.preventDefault();
        if (!draggedItem) return;
        const target = e.currentTarget;
        if (draggedItem === target) return;
        const source = selectedCourse?.viewType === 'double' ? doubleDisplayOrder : branchDisplayOrder;
        const draggedBranch = draggedItem.dataset.branch;
        const targetBranch = target.dataset.branch;
        const draggedIdx = source.findIndex(b => b.branch === draggedBranch);
        const targetIdx = source.findIndex(b => b.branch === targetBranch);
        if (draggedIdx !== -1 && targetIdx !== -1) {
          const [removed] = source.splice(draggedIdx, 1);
          source.splice(targetIdx, 0, removed);
          rebuildBranchOrderList();
        }
      }

      btnDownloadImage.addEventListener('click', () => {
